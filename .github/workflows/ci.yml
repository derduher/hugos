name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run lint` is unconfigured here and prompts interactively, so it
      # would hang a runner. `next build` typechecks, which is the check worth
      # having on a PR.
      - name: Build
        run: npm run build
